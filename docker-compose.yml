services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pommarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pommarket_dev_password}
      POSTGRES_DB: pommarket
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pommarket -d pommarket"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["pom-api"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BIND: 0.0.0.0:4321
      MIGRATION_DATABASE_URL: postgres://pommarket:${POSTGRES_PASSWORD:-pommarket_dev_password}@postgres:5432/pommarket
      APP_DATABASE_URL: postgres://pommarket_app:${APP_DB_PASSWORD}@postgres:5432/pommarket
      WORKER_DATABASE_URL: postgres://pommarket_worker:${WORKER_DB_PASSWORD}@postgres:5432/pommarket
    ports:
      - "${API_PORT:-4321}:4321"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["pom-worker"]
    env_file:
      - path: .env
        required: false
    environment:
      MIGRATION_DATABASE_URL: postgres://pommarket:${POSTGRES_PASSWORD:-pommarket_dev_password}@postgres:5432/pommarket
      APP_DATABASE_URL: postgres://pommarket_app:${APP_DB_PASSWORD}@postgres:5432/pommarket
      WORKER_DATABASE_URL: postgres://pommarket_worker:${WORKER_DB_PASSWORD}@postgres:5432/pommarket
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4321
    ports:
      - "${ADMIN_PORT:-4322}:4322"
    depends_on:
      - api

  user:
    build:
      context: .
      dockerfile: docker/user.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4321
    ports:
      - "${USER_PORT:-4323}:4323"
    depends_on:
      - api

volumes:
  postgres-data:
