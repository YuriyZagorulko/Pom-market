[package]
name = "pommarket"
version = "0.1.0"
edition = "2021"
publish = false
description = "Multi-tenant Polymarket copy-trading platform"
license = "UNLICENSED"

[[bin]]
name = "pom-api"
path = "src/bin/api.rs"

[[bin]]
name = "pom-worker"
path = "src/bin/worker.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
ipnet = "2"
hkdf = "0.12"
http = "1"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
polymarket_client_sdk_v2 = { version = "0.9", default-features = false, features = ["clob", "data"] }
alloy-primitives = "1"
alloy-signer = "1"
alloy-signer-local = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
