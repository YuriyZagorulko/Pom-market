global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "pommarket-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-backend:8000"]

  - job_name: "pommarket-rust-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rust-engine:8080"]
